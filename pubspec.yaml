name: dracin_reels
description: "Dracin Reels - aplikasi reels video pendek."
publish_to: "none"
version: 0.2.12+14

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  http: ^1.2.0
  shared_preferences: ^2.3.0
  file_picker: ^12.3.0
  package_info_plus: ^10.2.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
