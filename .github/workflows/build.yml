name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      # Keystore RILIS permanen (satu keystore untuk semua rilis):
      # di-decode dari repo secret ANDROID_KEYSTORE_BASE64 ke file
      # sementara runner (bukan commit, bukan log). Tanpa ini, build
      # release memakai keystore debug yang berubah tiap run dan
      # Android menolak update karena konflik tanda tangan.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      # Token updater diteruskan sebagai build define saja (bukan commit):
      # berasal dari repo secret UPDATER_GITHUB_TOKEN (baca-saja, khusus
      # repo ini). Bila secret kosong, define kosong dan updater di
      # aplikasi menonaktifkan diri dengan diam.
      - run: flutter build apk --release --dart-define=GITHUB_TOKEN=${{ secrets.UPDATER_GITHUB_TOKEN }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify APK
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk
      # Bukti tanda tangan dari APK HASIL BUILD (bukan dari sumber):
      # apksigner mencetak sertifikat penanda (SHA-256) — harus sama
      # dengan sidik jari keystore rilis di setiap build; build GAGAL
      # bila tanda tangan tidak valid.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(echo "$ANDROID_HOME"/build-tools/*/apksigner | awk '{print $1}')
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
      # Bukti permission dari APK HASIL BUILD (bukan dari sumber):
      # daftar permission dibaca dari APK lewat aapt2, dan build GAGAL
      # bila INTERNET tidak ada — ini yang pernah hilang diam-diam dan
      # membuat login selalu "tidak dapat terhubung".
      - name: Verify APK permissions
        shell: bash
        run: |
          AAPT=$(echo "$ANDROID_HOME"/build-tools/*/aapt2 | awk '{print $1}')
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "uses-permission"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -q "android.permission.INTERNET" || { echo "INTERNET permission missing from APK"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dracin-reels-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk dracin-reels.apk
          # Tag + versionCode dibaca dari pubspec (bukan hardcode), agar
          # updater di versi lama dapat membedakan rilis baru. Baris
          # "versionCode: N" di catatan rilis dipakai updater untuk
          # perbandingan numerik; tag semver dipakai bila baris itu
          # tidak ada (rilis lama).
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          CODE=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f2)
          TAG="v$VERSION"
          NOTES="Dracin Reels Flutter $TAG - pemutar video beneran di halaman Player + pratinjau video di formulir episode + progress upload nyata (X / Y MB) + daftar episode Player hanya series aktif + label versi di Profil.

          PENTING - MIGRASI TANDA TANGAN SEKALI INI: rilis ini memakai keystore rilis permanen (rilis lama memakai keystore debug yang berubah tiap build, sehingga Android menolak update sebagai paket bentrok). Pengguna WAJIB uninstall versi lama SEKALI lalu instal rilis ini; sesudah itu semua update berikutnya (termasuk via updater dalam aplikasi) akan terinstal bersih sebagai Update tanpa konflik.

          versionCode: $CODE

          Pembayaran/iklan beneran belum ada."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dracin-reels.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dracin-reels.apk --title "$TAG" --notes "$NOTES"
          fi
